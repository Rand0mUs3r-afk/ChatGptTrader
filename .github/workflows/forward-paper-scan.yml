name: Forward paper scan
on:
  workflow_dispatch:
    inputs:
      command:
        description: 'daily: settle completed sessions and plan next open; status: saved state only.'
        type: choice
        required: true
        default: daily
        options:
          - daily
          - status
permissions:
  contents: write
concurrency:
  group: forward-paper-compression-balanced
  cancel-in-progress: false
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PAPER_BRANCH: experiments/forward-paper-compression-balanced
      PAPER_COMMAND: ${{ inputs.command }}
    steps:
      - name: Check out frozen paper engine
        uses: actions/checkout@v4
        with:
          ref: f2b5542f892cf1c6f3724ed68d343b4699354541
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-scanner.txt
      - name: Install dependencies
        run: python -m pip install -e '.[dev]' -r requirements-scanner.txt
      - name: Run repository regression tests
        env:
          FRACTIONAL_SHARES: 'false'
        run: python -m pytest -q
      - name: Restore persistent paper state without resetting an existing book
        run: |
          set -euo pipefail
          case "$PAPER_COMMAND" in daily|status) ;; *) exit 1 ;; esac
          git fetch --no-tags origin "refs/heads/$PAPER_BRANCH"
          head=$(git rev-parse FETCH_HEAD)
          echo "PAPER_STATE_HEAD=$head" >> "$GITHUB_ENV"
          mkdir -p reports/paper_forward
          if git cat-file -e "$head:reports/paper_forward/state.json" 2>/dev/null; then
            git show "$head:reports/paper_forward/state.json" > reports/paper_forward/state.json
          elif git cat-file -e "$head:reports/paper_forward/latest_run.json" 2>/dev/null; then
            echo 'Existing run marker without state: refusing to reset paper accounts.' >&2
            exit 1
          elif [ "$PAPER_COMMAND" = status ]; then
            echo 'No saved paper book yet. Run daily first.' >&2
            exit 1
          else
            echo 'First prospective paper initialization; no historical entries will be created.'
          fi
      - name: Run paper scan or saved status
        run: python paper_forward.py "$PAPER_COMMAND"
      - name: Build next-session setup summary
        run: |
          python - <<'PY'
          import io
          import json
          import math
          import os
          from pathlib import Path
          import pandas as pd
          import exchange_calendars as xcals
          from paper_forward import digest,clock
          root=Path('reports/paper_forward')
          envelope=json.loads((root/'state.json').read_text(encoding='utf-8'))
          state=envelope['state']
          if envelope['sha256']!=digest(state):
              raise ValueError('Invalid paper-state checksum')
          status=json.loads((root/'status.json').read_text(encoding='utf-8'))
          plan=state['pending']
          lines=['# Forward paper scan','',
              'Paper simulation only. Close-qualified setups are conditional, not confirmed orders or target-hit predictions.',
              'Reference entry below is the signal-day close. Actual simulated entry, quantity and TP use the next-session open.',
              'Whole shares; independent USD 1,000 starting accounts; no leverage or brokerage orders.','',
              'Mode: '+os.environ['PAPER_COMMAND']]
          if os.environ['PAPER_COMMAND']=='status':
              lines+=['Saved state only: market data was not refreshed.']
          if plan:
              lines+=['Signal session: '+plan['signal_date'], 'Planned entry session: '+plan['entry_date'],
                  'Plan frozen at: '+plan['created_at'],'']
              cal=xcals.get_calendar('XNYS')
              if clock()>=cal.session_open(pd.Timestamp(plan['entry_date'])):
                  lines+=['The planned opening has passed. These are precommitted paper candidates, not fresh permission to enter late. Settle after the session closes.','']
          for mode,book in state['books'].items():
              stats=status['books'][mode]
              lines+=['## '+mode,'',f"Marked equity: {stats['marked_equity']:.2f} USD; closed trades: {stats['closed_trades']}; realized net P&L: {stats['realized_net_pnl']:.2f} USD.",'']
              if book['position']:
                  p=book['position']
                  lines+=[f"Existing paper position: {p['ticker']}, {p['shares']} shares; SL {p['stop']:.4f}; TP {p['target']:.4f}. No additional entry while occupied.",'']
              rows=plan['candidates'][mode] if plan else []
              if not rows:
                  lines+=['No new entry candidates in the saved plan (no qualifying signal or account occupied).','']
                  continue
              lines+=['| Rank | Ticker | Ref close | Structural SL | Ref 2R TP | Ref whole shares | Setup status |',
                  '|---:|---|---:|---:|---:|---:|---|']
              for rank,row in enumerate(rows,1):
                  frame=pd.read_csv(io.StringIO(plan['snapshots'][row['ticker']]['csv']))
                  ref=float(frame.Close.iloc[-1]);stop=float(row['stop']);slip=state['rules']['slippage']
                  risk=ref*(1+slip)-stop*(1-slip)
                  shares=max(0,min(math.floor(book['equity']*.25/(ref*(1+slip))),math.floor(book['equity']*.015/risk))) if ref>stop and risk>0 else 0
                  target=ref+2*(ref-stop)
                  flag='CONDITIONAL_AT_NEXT_OPEN' if shares else 'ZERO_WHOLE_SHARES_AT_REFERENCE'
                  lines+=[f"| {rank} | {row['ticker']} | {ref:.4f} | {stop:.4f} | {target:.4f} | {shares} | {flag} |"]
              lines+=['','Only the highest-ranked affordable, valid opening candidate can enter each paper account. Reference sizing is not a trade reservation.','']
          text='\n'.join(lines)+'\n'
          (root/'scan.md').write_text(text,encoding='utf-8')
          metadata=dict(run_id=os.environ['GITHUB_RUN_ID'],attempt=os.environ['GITHUB_RUN_ATTEMPT'],
              command=os.environ['PAPER_COMMAND'],generated_at=str(clock()),paper_only=True,
              code_commit='f2b5542f892cf1c6f3724ed68d343b4699354541',workflow_commit=os.environ['GITHUB_SHA'],
              restored_state_commit=os.environ['PAPER_STATE_HEAD'],state_sha256=envelope['sha256'])
          (root/'latest_run.json').write_text(json.dumps(metadata,indent=2)+'\n',encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as out:
              out.write(text)
          print(text)
          PY
      - name: Explain failure without presenting restored data as new results
        if: failure()
        run: echo 'Paper run failed. No new successful scan is claimed and no paper state will be published. Artifacts may contain the restored prior state; inspect the first failed step.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload scan, state backup and paper journals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forward-paper-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/paper_forward/
          if-no-files-found: warn
          retention-days: 30
      - name: Persist paper state only on the paper branch with non-force push
        if: success()
        run: |
          set -euo pipefail
          test -f reports/paper_forward/state.json
          remote_head=$(git ls-remote origin "refs/heads/$PAPER_BRANCH" | cut -f1)
          if [ "$remote_head" != "$PAPER_STATE_HEAD" ]; then
            echo 'Paper branch advanced after state restoration; refusing stale overwrite. Preserve artifact for review.' >&2
            exit 1
          fi
          publish_dir=$(mktemp -d "$RUNNER_TEMP/paper-publish.XXXXXX")
          git worktree add --detach "$publish_dir" "$PAPER_STATE_HEAD"
          trap 'git worktree remove --force "$publish_dir"' EXIT
          mkdir -p "$publish_dir/reports/paper_forward"
          for file in state.json status.json closed_trades.csv events.jsonl scan.md latest_run.json; do
            cp "reports/paper_forward/$file" "$publish_dir/reports/paper_forward/$file"
          done
          git -C "$publish_dir" config user.name 'github-actions[bot]'
          git -C "$publish_dir" config user.email 'github-actions[bot]@users.noreply.github.com'
          git -C "$publish_dir" add -f -- reports/paper_forward/state.json reports/paper_forward/status.json reports/paper_forward/closed_trades.csv reports/paper_forward/events.jsonl reports/paper_forward/scan.md reports/paper_forward/latest_run.json
          git -C "$publish_dir" commit -m "Record forward paper run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
          git -C "$publish_dir" push origin "HEAD:refs/heads/$PAPER_BRANCH"
