name: Run Swing Trading Bot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Test repository
        run: pytest -q
      - name: Run longer-history strategy lab
        run: python run_strategy_lab.py
      - name: Publish research summary
        if: always()
        run: |
          if [ -f reports/strategy_lab/research.md ]; then
            cat reports/strategy_lab/research.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No completed research run. Inspect failures; no performance conclusion is available." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload all trials, journals, and snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy-lab-results
          path: reports/strategy_lab/
          if-no-files-found: warn
          retention-days: 14
