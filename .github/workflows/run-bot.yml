name: Run Swing Trading Bot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Run tests
        run: pytest -q
      - name: Run short-history sandbox
        run: python run_short_history.py
      - name: Publish summary
        if: always()
        run: |
          if [ -f reports/short_history_15/summary.md ]; then
            cat reports/short_history_15/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No completed short-history test. Inspect failed steps." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: short-history-15-results
          path: reports/short_history_15/
          if-no-files-found: warn
          retention-days: 14
