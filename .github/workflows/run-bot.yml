name: Run Swing Trading Bot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Test repository
        run: pytest -q
      - name: Compare baseline, experimental pullback, and blend
        run: python compare_strategies.py
      - name: Publish comparison summary
        if: always()
        run: |
          if [ -f reports/strategy_experiment/comparison.md ]; then
            cat reports/strategy_experiment/comparison.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No completed market backtest. Inspect failed steps; no performance conclusion is available." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload results and input snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy-comparison
          path: reports/strategy_experiment/
          if-no-files-found: warn
          retention-days: 14
