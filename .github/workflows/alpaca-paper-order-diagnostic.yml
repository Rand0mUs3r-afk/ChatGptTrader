name: Alpaca paper order diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-order:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Trace BKR orders without trading
        env:
          ALPACA_PAPER_KEY_ID: ${{ secrets.ALPACA_PAPER_KEY_ID }}
          ALPACA_PAPER_SECRET_KEY: ${{ secrets.ALPACA_PAPER_SECRET_KEY }}
        run: |
          python - <<'PY'
          import http.client
          import json
          import os
          import sys
          from urllib.parse import urlencode

          def main():
              credentials = [os.environ.get(name, '') for name in ('ALPACA_PAPER_KEY_ID', 'ALPACA_PAPER_SECRET_KEY')]
              if not all(credentials):
                  sys.exit('Missing paper credentials; no request sent.')
              def get(path):
                  connection = http.client.HTTPSConnection('paper-api.alpaca.markets', timeout=20)
                  try:
                      connection.request('GET', path, headers=dict(zip(('APCA-API-KEY-ID', 'APCA-API-SECRET-KEY'), credentials)))
                      response = connection.getresponse()
                      if response.status != 200:
                          sys.exit(f'Paper lookup HTTP {response.status}; body withheld.')
                      raw = response.read(4000001)
                      if len(raw) > 4000000:
                          sys.exit('Response too large; body withheld.')
                      return json.loads(raw)
                  finally:
                      connection.close()
              query = urlencode(dict(status='all', symbols='BKR', after='2026-10-27T00:00:00Z', until='2026-10-28T00:00:00Z', direction='asc', limit=500, nested='true'))
              roots = get('/v2/orders?' + query)
              if not isinstance(roots, list):
                  sys.exit('Unexpected order history format; body withheld.')
              fields = ('id', 'client_order_id', 'symbol', 'side', 'type', 'status', 'order_class', 'qty', 'filled_qty', 'filled_avg_price', 'limit_price', 'stop_price', 'created_at', 'submitted_at', 'filled_at', 'canceled_at', 'updated_at')
              records = {}
              def collect(order, parent=None):
                  if order.get('symbol') != 'BKR':
                      return
                  record = {field: order.get(field) for field in fields}
                  record['parent_order_id'] = parent
                  record['bot_exit_id_match'] = str(order.get('client_order_id', '')).startswith('fp7v1-exit-')
                  records[order['id']] = record
                  for leg in order.get('legs') or []:
                      collect(leg, order['id'])
              for root in roots:
                  collect(root)
              for order_id in ('9c11ce53-ce1a-4a4c-aa6a-533cee27a38e', '157b2923-452e-4d83-a410-5a4fb7a7db56'):
                  order = get('/v2/orders/' + order_id + '?nested=true')
                  if order.get('id') != order_id or order.get('symbol') != 'BKR':
                      sys.exit('Unexpected order identity; body withheld.')
                  collect(order, records.get(order_id, {}).get('parent_order_id'))
              orders = sorted(records.values(), key=lambda order: (order.get('created_at') or '', order['id']))
              report = dict(read_only=True, history_limit_reached=len(roots) >= 500, orders=orders, filled_sells=[order for order in orders if order['side'] == 'sell' and float(order.get('filled_qty') or 0) > 0], note='Current order snapshots, not a complete event stream. An exit ID match identifies the bot exit path, not its exact trigger. A reached history limit means history may be incomplete.')
              text = json.dumps(report, indent=2)
              for credential in credentials:
                  text = text.replace(credential, '[REDACTED]')
              print(text)
              if os.environ.get('GITHUB_STEP_SUMMARY'):
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                      summary.write('# Read-only BKR order trace\n\n    ' + text.replace('\n', '\n    ') + '\n')

          try:
              main()
          except Exception:
              sys.exit('Diagnostic failed; exception details and broker bodies withheld.')
          PY
