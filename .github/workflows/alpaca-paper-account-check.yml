name: Alpaca paper account check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  account-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install 'pytest>=8,<10'
      - name: Test read-only account safeguards
        run: python -m pytest -q tests/test_alpaca_paper_readiness.py
      - name: Fetch paper account ID without orders
        env:
          ALPACA_PAPER_KEY_ID: ${{ secrets.ALPACA_PAPER_KEY_ID }}
          ALPACA_PAPER_SECRET_KEY: ${{ secrets.ALPACA_PAPER_SECRET_KEY }}
          ALPACA_EXPECTED_PAPER_ACCOUNT_ID: ${{ vars.ALPACA_EXPECTED_PAPER_ACCOUNT_ID }}
        run: python alpaca_paper_readiness.py
