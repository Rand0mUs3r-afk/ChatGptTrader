name: Scan latest setups
on:
  workflow_dispatch:
    inputs:
      market:
        description: 'Market: US uses USD; TSX uses CAD. Separate scenarios, no FX conversion.'
        required: true
        default: us
        type: choice
        options:
          - us
          - tsx
      equity:
        description: 'Equity in selected market currency: USD for us, CAD for tsx. Assumes flat account.'
        required: true
        default: '1000'
        type: string
      target_mode:
        description: 'Experimental data-checked targets, or original fixed-2R baseline. Research only; no orders.'
        required: true
        default: data_checked
        type: choice
        options:
          - data_checked
          - baseline_2r
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out reviewed scanner with validated data retries
        uses: actions/checkout@v4
        with:
          ref: a6f93f20b1664eb8843ac82c4c5726a3cfdbd92e
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-scanner.txt
      - name: Install scanner and test dependencies
        run: python -m pip install -e '.[dev]' -r requirements-scanner.txt
      - name: Run repository tests
        run: python -m pytest -q
      - name: Scan and assess latest completed session
        env:
          SCAN_MARKET: ${{ inputs.market }}
          SCAN_EQUITY: ${{ inputs.equity }}
          TARGET_MODE: ${{ inputs.target_mode }}
        run: |
          case "$TARGET_MODE" in
            data_checked) python assess_targets.py --market "$SCAN_MARKET" --equity "$SCAN_EQUITY" ;;
            baseline_2r) python explain_scan.py --market "$SCAN_MARKET" --equity "$SCAN_EQUITY" ;;
            *) echo 'Invalid target mode' >&2; exit 1 ;;
          esac
      - name: Publish scan summary
        if: always()
        run: |
          if [ -f reports/latest_setups/summary.md ]; then
            cat reports/latest_setups/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No scan report was produced. Check the first failed step; this is not a no-setups result.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload scan reports and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-setup-scan-${{ inputs.market }}-${{ inputs.target_mode }}-${{ github.run_id }}
          path: reports/latest_setups/
          if-no-files-found: warn
          retention-days: 14
