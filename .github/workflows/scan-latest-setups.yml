name: Scan latest setups
on:
  workflow_dispatch:
    inputs:
      market:
        description: 'Market: US uses USD; TSX uses CAD. Separate scenarios, no FX conversion.'
        required: true
        default: us
        type: choice
        options:
          - us
          - tsx
      equity:
        description: 'Equity in selected market currency: USD for us, CAD for tsx. Assumes flat account.'
        required: true
        default: '1000'
        type: string
      target_mode:
        description: 'Experimental joint structural SL/TP, or original fixed-2R baseline. Research only; no orders.'
        required: true
        default: data_checked
        type: choice
        options:
          - data_checked
          - baseline_2r
      fractional_shares:
        description: 'Simulate 0.001-share increments, minimum notional 1. Broker fractional eligibility and SL/TP execution unverified.'
        required: true
        default: true
        type: boolean
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out expanded TSX universe and reviewed fractional sizing
        uses: actions/checkout@v4
        with:
          ref: 648a80f444e4e46740ac4bff04aaa0649096524d
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-scanner.txt
      - name: Install scanner and test dependencies
        run: python -m pip install -e '.[dev]' -r requirements-scanner.txt
      - name: Run whole-share baseline and fractional regression tests
        env:
          FRACTIONAL_SHARES: 'false'
        run: python -m pytest -q
      - name: Scan and assess latest completed session
        env:
          SCAN_MARKET: ${{ inputs.market }}
          SCAN_EQUITY: ${{ inputs.equity }}
          TARGET_MODE: ${{ inputs.target_mode }}
          FRACTIONAL_SHARES: ${{ inputs.fractional_shares && 'true' || 'false' }}
        run: |
          case "$TARGET_MODE" in
            data_checked) python assess_structural_risk.py --market "$SCAN_MARKET" --equity "$SCAN_EQUITY" ;;
            baseline_2r) python explain_scan.py --market "$SCAN_MARKET" --equity "$SCAN_EQUITY" ;;
            *) echo 'Invalid target mode' >&2; exit 1 ;;
          esac
      - name: Publish scan summary and sizing assumptions
        if: always()
        env:
          FRACTIONAL_SHARES: ${{ inputs.fractional_shares && 'true' || 'false' }}
        run: |
          echo "## Sizing mode: fractional_shares=$FRACTIONAL_SHARES" >> "$GITHUB_STEP_SUMMARY"
          echo 'Research simulation only. Fractional broker eligibility, quantity precision, and protective SL/TP execution are unverified; no orders placed.' >> "$GITHUB_STEP_SUMMARY"
          if [ -f reports/latest_setups/summary.md ]; then
            cat reports/latest_setups/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No scan report was produced. Check the first failed step; this is not a no-setups result.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload scan reports and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-setup-scan-${{ inputs.market }}-${{ inputs.target_mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/latest_setups/
          if-no-files-found: warn
          retention-days: 14
