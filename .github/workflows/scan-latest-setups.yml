name: Scan latest setups
on:
  workflow_dispatch:
    inputs:
      market:
        description: 'Market: US uses USD; TSX uses CAD. Separate scenarios, no FX conversion.'
        required: true
        default: us
        type: choice
        options:
          - us
          - tsx
      equity:
        description: 'Equity in selected market currency: USD for us, CAD for tsx. Assumes flat account.'
        required: true
        default: '1000'
        type: string
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out reviewed US and TSX scanner with explanations
        uses: actions/checkout@v4
        with:
          ref: fe4303b5c91ee06ac3d522fc80a751b0cd9a7245
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-scanner.txt
      - name: Install scanner and test dependencies
        run: python -m pip install -e '.[dev]' -r requirements-scanner.txt
      - name: Run repository tests
        run: python -m pytest -q
      - name: Scan and explain latest completed session for selected exchange
        env:
          SCAN_MARKET: ${{ inputs.market }}
          SCAN_EQUITY: ${{ inputs.equity }}
        run: python explain_scan.py --market "$SCAN_MARKET" --equity "$SCAN_EQUITY"
      - name: Publish scan summary
        if: always()
        run: |
          if [ -f reports/latest_setups/summary.md ]; then
            cat reports/latest_setups/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload scan reports and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-setup-scan-${{ inputs.market }}-${{ github.run_id }}
          path: reports/latest_setups/
          if-no-files-found: warn
          retention-days: 14
