name: Scan latest setups
on:
  workflow_dispatch:
    inputs:
      equity:
        description: 'Account equity in USD (assumes flat account; no orders)'
        required: true
        default: '1000'
        type: string
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out reviewed scanner from experiment branch
        uses: actions/checkout@v4
        with:
          ref: 6c82fe0d891a5a0eb7370fbf30354a79c6e200bf
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-scanner.txt
      - name: Install scanner and test dependencies
        run: python -m pip install -e '.[dev]' -r requirements-scanner.txt
      - name: Run repository tests
        run: python -m pytest -q
      - name: Scan latest completed session
        env:
          SCAN_EQUITY: ${{ inputs.equity }}
        run: python scan_latest_setups.py --equity "$SCAN_EQUITY"
      - name: Publish scan summary
        if: always()
        run: |
          if [ -f reports/latest_setups/summary.md ]; then
            cat reports/latest_setups/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload scan reports and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-setup-scan-${{ github.run_id }}
          path: reports/latest_setups/
          if-no-files-found: warn
          retention-days: 14
