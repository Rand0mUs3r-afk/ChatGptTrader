name: Since 2021 45-session backtest
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/since-2021-45-session.yml
  workflow_dispatch:
    inputs:
      market:
        description: 'Entries since January 2021 on any eligible signal-qualified session; max 45 trading sessions.'
        required: true
        default: both
        type: choice
        options:
          - both
          - us
          - tsx
      equity_us:
        description: 'Starting equity per independent continuous US account, USD.'
        required: true
        default: '1000'
        type: string
      equity_tsx:
        description: 'Starting equity per independent continuous TSX account, CAD.'
        required: true
        default: '1000'
        type: string
      share_mode:
        description: 'Fractional simulation or whole shares; broker execution unverified.'
        required: true
        default: fractional
        type: choice
        options:
          - fractional
          - whole
permissions:
  contents: write
concurrency:
  group: since-2021-45-session-backtest
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out reviewed 2021-onward runner and history-window fix
        uses: actions/checkout@v4
        with:
          ref: 4103c8474b0502aa2c291795983147b7311a2d05
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-scanner.txt
      - name: Install dependencies
        run: python -m pip install -e '.[dev]' -r requirements-scanner.txt
      - name: Run 2021 date-window, non-Monday entry, yearly-return and regression tests
        env:
          FRACTIONAL_SHARES: 'false'
        run: python -m pytest -q
      - name: Clear only generated 2021-onward output in temporary runner checkout
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          path = Path('reports/since_2021_45_session')
          if path.exists():
              shutil.rmtree(path)
          PY
      - name: Verify permanent ticker exclusions and record source watchlists
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from swingbot.scanner import load_tickers
          us = Path('config/tickers.txt')
          tsx = Path('config/tickers_tsx.txt')
          tickers = sorted(set(load_tickers(str(us))))
          if {'AMD','AMZN'} & set(tickers):
              raise ValueError('Unexpected AMD or AMZN in source watchlist')
          out = Path('reports/since_2021_45_session')
          out.mkdir(parents=True,exist_ok=True)
          audit = dict(excluded_us_tickers=['AMD','AMZN'],source_us_tickers=tickers,
              source_tsx_tickers=sorted(set(load_tickers(str(tsx)))),
              us_config_sha256=hashlib.sha256(us.read_bytes()).hexdigest(),
              tsx_config_sha256=hashlib.sha256(tsx.read_bytes()).hexdigest(),
              source_commit='4103c8474b0502aa2c291795983147b7311a2d05',workflow_commit=os.environ['GITHUB_SHA'])
          (out/'source_universe.json').write_text(json.dumps(audit,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(audit,indent=2))
          PY
      - name: Run entries since 2021 with maximum 45 trading sessions
        env:
          BT_MARKET: ${{ inputs.market || 'both' }}
          BT_EQUITY_US: ${{ inputs.equity_us || '1000' }}
          BT_EQUITY_TSX: ${{ inputs.equity_tsx || '1000' }}
          BT_SHARE_MODE: ${{ inputs.share_mode || 'fractional' }}
        run: python since_2021_45_session.py --market "$BT_MARKET" --equity-us "$BT_EQUITY_US" --equity-tsx "$BT_EQUITY_TSX" --share-mode "$BT_SHARE_MODE"
      - name: Record source versions in successful results
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path('reports/since_2021_45_session/results.json')
          report = json.loads(path.read_text(encoding='utf-8'))
          if report['entry_start'] != '2021-01-01' or report['max_hold_sessions'] != 45:
              raise ValueError('Unexpected study configuration')
          report.update(source_commit='4103c8474b0502aa2c291795983147b7311a2d05',
              workflow_commit=os.environ['GITHUB_SHA'],history_window_fix=True)
          path.write_text(json.dumps(report,indent=2,allow_nan=False)+'\n',encoding='utf-8')
          PY
      - name: Publish full-period, calendar-year and sample-feasibility summary
        if: always()
        run: |
          if [ -f reports/since_2021_45_session/summary.md ]; then
            cat reports/since_2021_45_session/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '2021-onward backtest did not finish. Check the first failed step; no completed new results are available.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload complete reports, yearly results, audits and price snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: since-2021-45-session-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/since_2021_45_session/
          if-no-files-found: warn
          retention-days: 14
      - name: Archive 2021-onward results without overwriting earlier experiments
        if: success()
        env:
          REPORT_MARKET: ${{ inputs.market || 'both' }}
          REPORT_SHARE_MODE: ${{ inputs.share_mode || 'fractional' }}
        run: |
          set -euo pipefail
          test -f reports/since_2021_45_session/results.json
          for attempt in 1 2 3; do
            git fetch --no-tags origin refs/heads/experiments/recent-weighted-swing-blend
            publish_dir=$(mktemp -d "$RUNNER_TEMP/since2021-publish.XXXXXX")
            git worktree add --detach "$publish_dir" FETCH_HEAD
            PUBLISH_DIR="$publish_dir" python - <<'PY'
          import json
          import os
          import re
          import shutil
          from pathlib import Path
          source = Path('reports/since_2021_45_session')
          key = os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT']
          if not re.fullmatch(r'[0-9]+-[0-9]+',key):
              raise ValueError('Invalid run key')
          relative = Path('reports/since_2021_45_session/runs')/key
          archive = Path(os.environ['PUBLISH_DIR'])/relative
          archive.mkdir(parents=True,exist_ok=False)
          for item in sorted(source.rglob('*')):
              if item.relative_to(source).parts[0] == 'runs':
                  continue
              if item.is_file() and (item.name in ('summary.md','results.json','results.csv','calendar_year_results.csv','source_universe.json') or item.name.endswith(('_journal.json','_journal.csv','_daily_equity.csv','_decisions.csv','_calibration_audit.json'))):
                  destination = archive/item.relative_to(source)
                  destination.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copyfile(item,destination)
          pointer = dict(run_key=key,experiment='since_2021_45_session_empirical_targets',
              entry_start='2021-01-01',max_hold_sessions=45,entry_schedule='any_eligible_trading_session_with_qualifying_signal',
              market=os.environ.get('REPORT_MARKET','both'),share_mode=os.environ.get('REPORT_SHARE_MODE','fractional'),
              excluded_us_tickers=['AMD','AMZN'],history_window_fix=True,
              source_commit='4103c8474b0502aa2c291795983147b7311a2d05',workflow_commit=os.environ['GITHUB_SHA'],
              results_json=str(relative/'results.json'),calendar_year_csv=str(relative/'calendar_year_results.csv'),
              source_universe_json=str(relative/'source_universe.json'),summary_markdown=str(relative/'summary.md'))
          (Path(os.environ['PUBLISH_DIR'])/'reports/since_2021_45_session/latest_run.json').write_text(json.dumps(pointer,indent=2)+'\n',encoding='utf-8')
          PY
            git -C "$publish_dir" config user.name 'github-actions[bot]'
            git -C "$publish_dir" config user.email 'github-actions[bot]@users.noreply.github.com'
            git -C "$publish_dir" add -f -- "reports/since_2021_45_session/runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" reports/since_2021_45_session/latest_run.json
            git -C "$publish_dir" commit -m "Record 2021-onward 45-session run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
            if git -C "$publish_dir" push origin HEAD:refs/heads/experiments/recent-weighted-swing-blend; then
              git worktree remove "$publish_dir"
              exit 0
            fi
            git worktree remove --force "$publish_dir"
            sleep $((attempt * 2))
          done
          echo 'Report publication failed after three fresh-head attempts. Results remain in Actions summary/artifact.' >&2
          exit 1
