name: October 2026 backtest
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/october-2026-backtest.yml
  workflow_dispatch:
    inputs:
      experiment:
        description: '15-session empirical-target experiment or preserved 5/7-session model comparison.'
        required: true
        default: 15_session_empirical_targets
        type: choice
        options:
          - 15_session_empirical_targets
          - model_comparison
      market:
        description: 'October entries only; independent US/USD and TSX/CAD accounts.'
        required: true
        default: both
        type: choice
        options:
          - both
          - us
          - tsx
      equity_us:
        description: 'Starting equity per independent US scenario, in USD.'
        required: true
        default: '1000'
        type: string
      equity_tsx:
        description: 'Starting equity per independent TSX scenario, in CAD.'
        required: true
        default: '1000'
        type: string
      share_mode:
        description: 'Fractional simulation or whole-share comparison; broker execution unverified.'
        required: true
        default: fractional
        type: choice
        options:
          - fractional
          - whole
permissions:
  contents: write
concurrency:
  group: october-2026-backtest
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out reviewed 15-session empirical-target experiment
        uses: actions/checkout@v4
        with:
          ref: f60225366c61af46b89f3c86c4d021889beeb239
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-scanner.txt
      - name: Install dependencies
        run: python -m pip install -e '.[dev]' -r requirements-scanner.txt
      - name: Run 15-session, causality, sizing and regression tests
        env:
          FRACTIONAL_SHARES: 'false'
        run: python -m pytest -q
      - name: Clear only generated output in temporary runner checkout
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          path = Path('reports/october_2026')
          if path.exists():
              shutil.rmtree(path)
          PY
      - name: Run selected October-entry research experiment
        env:
          BT_EXPERIMENT: ${{ inputs.experiment || '15_session_empirical_targets' }}
          BT_MARKET: ${{ inputs.market || 'both' }}
          BT_EQUITY_US: ${{ inputs.equity_us || '1000' }}
          BT_EQUITY_TSX: ${{ inputs.equity_tsx || '1000' }}
          BT_SHARE_MODE: ${{ inputs.share_mode || 'fractional' }}
        run: |
          case "$BT_EXPERIMENT" in
            15_session_empirical_targets) python october_15_session.py --market "$BT_MARKET" --equity-us "$BT_EQUITY_US" --equity-tsx "$BT_EQUITY_TSX" --share-mode "$BT_SHARE_MODE" ;;
            model_comparison) python compare_october_models.py --market "$BT_MARKET" --equity-us "$BT_EQUITY_US" --equity-tsx "$BT_EQUITY_TSX" --share-mode "$BT_SHARE_MODE" ;;
            *) echo 'Invalid experiment' >&2; exit 1 ;;
          esac
      - name: Publish research summary and maturity warnings
        if: always()
        run: |
          if [ -f reports/october_2026/summary.md ]; then
            cat reports/october_2026/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'October experiment did not finish. Check the first failed step; no new performance results are available.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload reports, calibration audits and price snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: october-2026-research-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/october_2026/
          if-no-files-found: warn
          retention-days: 14
      - name: Archive research run on latest experiment branch without overwriting history
        if: success()
        env:
          REPORT_EXPERIMENT: ${{ inputs.experiment || '15_session_empirical_targets' }}
          REPORT_MARKET: ${{ inputs.market || 'both' }}
          REPORT_SHARE_MODE: ${{ inputs.share_mode || 'fractional' }}
        run: |
          set -euo pipefail
          test -f reports/october_2026/results.json
          for attempt in 1 2 3; do
            git fetch --no-tags origin refs/heads/experiments/recent-weighted-swing-blend
            publish_dir=$(mktemp -d "$RUNNER_TEMP/october-publish.XXXXXX")
            git worktree add --detach "$publish_dir" FETCH_HEAD
            PUBLISH_DIR="$publish_dir" python - <<'PY'
          import json
          import os
          import re
          import shutil
          from pathlib import Path
          source = Path("reports/october_2026")
          key = os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"]
          if not re.fullmatch(r"[0-9]+-[0-9]+", key):
              raise ValueError("Invalid run key")
          relative = Path("reports/october_2026/runs") / key
          archive = Path(os.environ["PUBLISH_DIR"]) / relative
          archive.mkdir(parents=True, exist_ok=False)
          for item in sorted(source.rglob("*")):
              if item.relative_to(source).parts[0] == "runs":
                  continue
              if item.is_file() and (item.name in ("summary.md", "results.json", "results.csv") or item.name.endswith(("_journal.json", "_journal.csv", "_daily_equity.csv", "_decisions.csv", "_calibration_audit.json"))):
                  destination = archive / item.relative_to(source)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(item, destination)
          pointer = dict(run_key=key, market=os.environ.get("REPORT_MARKET", "both"),
              share_mode=os.environ.get("REPORT_SHARE_MODE", "fractional"),
              experiment=os.environ.get("REPORT_EXPERIMENT", "15_session_empirical_targets"),
              source_commit="f60225366c61af46b89f3c86c4d021889beeb239",
              results_json=str(relative / "results.json"), summary_markdown=str(relative / "summary.md"))
          (Path(os.environ["PUBLISH_DIR"]) / "reports/october_2026/latest_run.json").write_text(json.dumps(pointer, indent=2) + "\n", encoding="utf-8")
          PY
            git -C "$publish_dir" config user.name 'github-actions[bot]'
            git -C "$publish_dir" config user.email 'github-actions[bot]@users.noreply.github.com'
            git -C "$publish_dir" add -f -- "reports/october_2026/runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" reports/october_2026/latest_run.json
            git -C "$publish_dir" commit -m "Record October research run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
            if git -C "$publish_dir" push origin HEAD:refs/heads/experiments/recent-weighted-swing-blend; then
              git worktree remove "$publish_dir"
              exit 0
            fi
            git worktree remove --force "$publish_dir"
            sleep $((attempt * 2))
          done
          echo 'Report publication failed after three fresh-head attempts. Results remain in Actions summary/artifact.' >&2
          exit 1
