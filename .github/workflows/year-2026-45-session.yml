name: 2026 YTD 45-session backtest
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/year-2026-45-session.yml
  workflow_dispatch:
    inputs:
      market:
        description: '2026 YTD entries; maximum 45 trading sessions, independent scenarios.'
        required: true
        default: both
        type: choice
        options:
          - both
          - us
          - tsx
      equity_us:
        description: 'Starting equity per independent US scenario, USD.'
        required: true
        default: '1000'
        type: string
      equity_tsx:
        description: 'Starting equity per independent TSX scenario, CAD.'
        required: true
        default: '1000'
        type: string
      share_mode:
        description: 'Fractional simulation or whole shares; broker execution unverified.'
        required: true
        default: fractional
        type: choice
        options:
          - fractional
          - whole
permissions:
  contents: write
concurrency:
  group: year-2026-45-session-backtest
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out reviewed 2026 YTD 45-session experiment
        uses: actions/checkout@v4
        with:
          ref: dad7052c9dc33f45ac1143f935035811b3c3da63
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-scanner.txt
      - name: Install dependencies
        run: python -m pip install -e '.[dev]' -r requirements-scanner.txt
      - name: Run 2026 window, 45-session exit, causality and regression tests
        env:
          FRACTIONAL_SHARES: 'false'
        run: python -m pytest -q
      - name: Clear only generated YTD output in temporary runner checkout
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          path = Path('reports/year_2026_45_session')
          if path.exists():
              shutil.rmtree(path)
          PY
      - name: Run 2026 YTD 45-session research
        env:
          BT_MARKET: ${{ inputs.market || 'both' }}
          BT_EQUITY_US: ${{ inputs.equity_us || '1000' }}
          BT_EQUITY_TSX: ${{ inputs.equity_tsx || '1000' }}
          BT_SHARE_MODE: ${{ inputs.share_mode || 'fractional' }}
        run: python year_2026_45_session.py --market "$BT_MARKET" --equity-us "$BT_EQUITY_US" --equity-tsx "$BT_EQUITY_TSX" --share-mode "$BT_SHARE_MODE"
      - name: Publish YTD research summary and maturity warnings
        if: always()
        run: |
          if [ -f reports/year_2026_45_session/summary.md ]; then
            cat reports/year_2026_45_session/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '2026 YTD 45-session experiment did not finish. Check the first failed step; no new performance results are available.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload reports, calibration audits and price snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: year-2026-45-session-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/year_2026_45_session/
          if-no-files-found: warn
          retention-days: 14
      - name: Archive YTD results without overwriting earlier research
        if: success()
        env:
          REPORT_MARKET: ${{ inputs.market || 'both' }}
          REPORT_SHARE_MODE: ${{ inputs.share_mode || 'fractional' }}
        run: |
          set -euo pipefail
          test -f reports/year_2026_45_session/results.json
          for attempt in 1 2 3; do
            git fetch --no-tags origin refs/heads/experiments/recent-weighted-swing-blend
            publish_dir=$(mktemp -d "$RUNNER_TEMP/ytd45-publish.XXXXXX")
            git worktree add --detach "$publish_dir" FETCH_HEAD
            PUBLISH_DIR="$publish_dir" python - <<'PY'
          import json
          import os
          import re
          import shutil
          from pathlib import Path
          source = Path('reports/year_2026_45_session')
          key = os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT']
          if not re.fullmatch(r'[0-9]+-[0-9]+', key):
              raise ValueError('Invalid run key')
          relative = Path('reports/year_2026_45_session/runs') / key
          archive = Path(os.environ['PUBLISH_DIR']) / relative
          archive.mkdir(parents=True, exist_ok=False)
          for item in sorted(source.rglob('*')):
              if item.relative_to(source).parts[0] == 'runs':
                  continue
              if item.is_file() and (item.name in ('summary.md','results.json','results.csv') or item.name.endswith(('_journal.json','_journal.csv','_daily_equity.csv','_decisions.csv','_calibration_audit.json'))):
                  destination = archive / item.relative_to(source)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(item,destination)
          pointer = dict(run_key=key,experiment='2026_ytd_45_session_empirical_targets',
              entry_start='2026-01-01',max_hold_sessions=45,
              market=os.environ.get('REPORT_MARKET','both'),share_mode=os.environ.get('REPORT_SHARE_MODE','fractional'),
              source_commit='dad7052c9dc33f45ac1143f935035811b3c3da63',
              results_json=str(relative/'results.json'),summary_markdown=str(relative/'summary.md'))
          (Path(os.environ['PUBLISH_DIR'])/'reports/year_2026_45_session/latest_run.json').write_text(json.dumps(pointer,indent=2)+'\n',encoding='utf-8')
          PY
            git -C "$publish_dir" config user.name 'github-actions[bot]'
            git -C "$publish_dir" config user.email 'github-actions[bot]@users.noreply.github.com'
            git -C "$publish_dir" add -f -- "reports/year_2026_45_session/runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" reports/year_2026_45_session/latest_run.json
            git -C "$publish_dir" commit -m "Record 2026 YTD 45-session run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
            if git -C "$publish_dir" push origin HEAD:refs/heads/experiments/recent-weighted-swing-blend; then
              git worktree remove "$publish_dir"
              exit 0
            fi
            git worktree remove --force "$publish_dir"
            sleep $((attempt * 2))
          done
          echo 'YTD report publication failed after three fresh-head attempts. Results remain in Actions summary/artifact.' >&2
          exit 1
