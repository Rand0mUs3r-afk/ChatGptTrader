name: Recent-weighted swing blend
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out recent-weighted experiment
        uses: actions/checkout@v4
        with:
          ref: experiments/recent-weighted-swing-blend
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run repository tests
        run: pytest -q
      - name: Run recent-weighted swing research
        run: python run_recent_blend.py
      - name: Publish summary
        if: always()
        run: |
          if [ -f reports/recent_swing_blend/summary.md ]; then
            cat reports/recent_swing_blend/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload research reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recent-weighted-swing-reports
          path: reports/recent_swing_blend/
          if-no-files-found: warn
