name: US and TSX assessed setup scan
on:
  workflow_dispatch:
    inputs:
      market:
        description: 'Expanded TSX holdings; existing US universe and paper books unchanged.'
        type: choice
        required: true
        default: both
        options: [both, us, tsx]
permissions:
  contents: read
concurrency:
  group: us-tsx-assessed-setup-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SCAN_MARKET: ${{ inputs.market }}
    steps:
      - name: Frozen analysis engine
        uses: actions/checkout@v4
        with:
          ref: f2b5542f892cf1c6f3724ed68d343b4699354541
          persist-credentials: false
      - name: Frozen assessed-scan implementation
        uses: actions/checkout@v4
        with:
          ref: 17449e2c0b8c3aa21b866e7522b77f9d09c2689d
          path: scan-template
          sparse-checkout: .github/workflows/us-tsx-assessed-setup-scan.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Watchlists from this exact workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: watchlist-source
          sparse-checkout: |
            config/tickers_tsx.txt
            config/tsx_holdings_names.csv
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e '.[dev]' -r requirements-scanner.txt 'PyYAML>=6,<7'
      - name: Run original regression suite before applying new scan universe
        env:
          FRACTIONAL_SHARES: 'false'
        run: python -m pytest -q
      - name: Validate holdings mapping and run expanded prospective assessment
        run: |
          python - <<'PY'
          import csv,hashlib,io,json,os
          from pathlib import Path
          from collections import Counter
          import pandas as pd
          import yaml
          from swingbot.scanner import load_tickers
          source=Path('watchlist-source/config')
          rows=list(csv.DictReader((source/'tsx_holdings_names.csv').open(encoding='utf-8')))
          mapped={r['ticker']:r for r in rows}
          if len(rows)!=216 or len(mapped)!=216 or Counter(r['source_funds'] for r in rows)!=Counter({'XMD':156,'XIU':60}):
              raise ValueError('Unexpected or duplicated holdings mapping')
          for r in rows:
              if not r['company_name'] or r['ticker']!=r['native_symbol'].replace('.','-')+'.TO' or r['holdings_asof']!='2026-10-23':
                  raise ValueError('Invalid name, ticker mapping or holdings date')
          wanted=set(load_tickers(str(source/'tickers_tsx.txt')))
          original=set(load_tickers('config/tickers_tsx.txt'))
          if len(wanted)!=225 or not set(mapped)<=wanted or not original<=wanted or any(not t.endswith('.TO') for t in wanted):
              raise ValueError('Unexpected TSX universe change')
          Path('config/tickers_tsx.txt').write_text((source/'tickers_tsx.txt').read_text(encoding='utf-8'),encoding='utf-8')
          path=Path('config/tsx_added_eligibility.csv')
          with path.open(encoding='utf-8-sig',newline='') as f:
              reader=csv.DictReader(f);fields=reader.fieldnames;dated=list(reader)
          for ticker in sorted(wanted-original):
              dated.append(dict.fromkeys(fields,'')|dict(ticker=ticker,eligible_from='2026-10-26'))
          with path.open('w',encoding='utf-8',newline='') as f:
              writer=csv.DictWriter(f,fieldnames=fields,lineterminator='\n');writer.writeheader();writer.writerows(dated)
          out=Path('reports/assessed_setup_scan');out.mkdir(parents=True,exist_ok=True)
          provenance=dict(imported_stock_reit_mappings=216,total_tsx_tickers=225,new_tsx_tickers=len(wanted-original),
              holdings_asof='2026-10-23',new_selection_eligible_from='2026-10-26',
              quarantined=[dict(identifier='2299955D',name='CONSTELLATION SOFTWARE INC',reason='WARRANT_IDENTIFIER_NOT_COMMON_STOCK',retained_stock='CSU.TO')],
              source_file_sha256={'XMD_holdings.csv':'3717bda616226450413029659081329331464185b8f6ec53189536637081d1b5','XIU_holdings.csv':'1afe66ce39bbee2eda114804971536cbf9e82dccc72105720238901ce450bd8c'},
              names_registry_sha256=hashlib.sha256((source/'tsx_holdings_names.csv').read_bytes()).hexdigest(),
              effective_tsx_watchlist_sha256=hashlib.sha256(Path('config/tickers_tsx.txt').read_bytes()).hexdigest(),
              workflow_commit=os.environ['GITHUB_SHA'],us_sp500_expansion_included=False,
              identity_note='Names/exchange reconciled to uploaded holdings; independent provider identity validation is not claimed. Quotes retain strict validation.')
          (out/'watchlist_import.json').write_text(json.dumps(provenance,indent=2)+'\n',encoding='utf-8')
          template=yaml.safe_load(Path('scan-template/.github/workflows/us-tsx-assessed-setup-scan.yml').read_text(encoding='utf-8'))
          step=next(s for s in template['jobs']['scan']['steps'] if s.get('name')=='Assess US and TSX next-session targets using completed history')
          run=step['run'];prefix="python - <<'PY'\n"
          if not run.startswith(prefix):
              raise ValueError('Unexpected frozen scan template')
          script=run.split(prefix,1)[1].rsplit('\nPY',1)[0]
          old='eligibility[ticker]>pd.Timestamp(signal_day)'
          if script.count(old)!=1:
              raise ValueError('Unexpected eligibility implementation')
          script=script.replace(old,'eligibility[ticker]>pd.Timestamp(entry_day)').replace('NOT_YET_SELECTED_AS_OF_SIGNAL','NOT_ELIGIBLE_FOR_ENTRY_SESSION')
          exec(compile(script,'frozen_assessed_scan','exec'),{'__name__':'__main__'})
          path=out/'assessed_setups.json';report=json.loads(path.read_text(encoding='utf-8'))
          note='Expanded TSX source universe: 216 stock/REIT mappings plus retained existing names, 225 unique tickers. One Constellation warrant identifier is quarantined. New additions are eligible from October 26, 2026; US S&P 500 expansion is not included. This changes the research universe, not existing paper-account state.'
          report['watchlist_import']=provenance;report['notes']=note+' '+report['notes']
          for r in report['setups']:
              m=mapped.get(r['ticker']) if r['market']=='tsx' else None
              r['holdings_company_name']=m['company_name'] if m else None
              r['holdings_source_funds']=m['source_funds'] if m else None
          path.write_text(json.dumps(report,indent=2,allow_nan=False),encoding='utf-8')
          table=pd.read_csv(out/'assessed_setups.csv',keep_default_na=False)
          table['holdings_company_name']=[mapped.get(t,{}).get('company_name','') for t in table['ticker']]
          table['holdings_source_funds']=[mapped.get(t,{}).get('source_funds','') for t in table['ticker']]
          table.to_csv(out/'assessed_setups.csv',index=False)
          text=(out/'summary.md').read_text(encoding='utf-8')
          for ticker,r in mapped.items():
              text=text.replace('| '+ticker+' |','| '+ticker+' / '+r['company_name']+' |')
          text='# Expanded TSX watchlist\n\n'+note+'\n\n'+text
          (out/'summary.md').write_text(text,encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'w',encoding='utf-8') as f:
              f.write(text)
          PY
      - name: Clearly mark incomplete assessments
        if: failure()
        run: echo 'Expanded assessment failed; partial artifacts are not a completed scan. Existing paper accounts were not changed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload complete assessment and import audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expanded-tsx-assessed-setups-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/assessed_setup_scan/
          if-no-files-found: warn
          retention-days: 14
