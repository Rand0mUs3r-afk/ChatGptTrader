name: Alpaca paper pilot
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check: account only; scan: read-only S&P registry/signals; tick: paper order coordinator'
        type: choice
        default: check
        required: true
        options: [check, scan, tick]
  schedule:
    - cron: '2-57/5 13-21 * * 1-5'
permissions:
  contents: read
concurrency:
  group: alpaca-paper-pilot-account
  cancel-in-progress: false
jobs:
  paper:
    if: github.event_name == 'workflow_dispatch' || vars.ALPACA_PAPER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check out frozen signal definitions separately
        uses: actions/checkout@v4
        with:
          ref: f2b5542f892cf1c6f3724ed68d343b4699354541
          path: signal_source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pilot dependencies
        run: python -m pip install 'pandas>=2,<3' 'numpy>=1.26,<3' 'beautifulsoup4>=4.12,<5' 'pytest>=8,<10'
      - name: Test account, routing, universe and execution safeguards without broker credentials
        run: python -m pytest -q tests/test_alpaca_paper_readiness.py tests/test_alpaca_paper_bot.py
      - name: Run paper coordinator
        env:
          PILOT_MODE: ${{ inputs.mode || 'tick' }}
          ALPACA_PAPER_KEY_ID: ${{ secrets.ALPACA_PAPER_KEY_ID }}
          ALPACA_PAPER_SECRET_KEY: ${{ secrets.ALPACA_PAPER_SECRET_KEY }}
          ALPACA_EXPECTED_PAPER_ACCOUNT_ID: ${{ vars.ALPACA_EXPECTED_PAPER_ACCOUNT_ID }}
          ALPACA_PAPER_ENABLED: ${{ vars.ALPACA_PAPER_ENABLED || 'false' }}
          ALPACA_PAPER_STRATEGY: ${{ vars.ALPACA_PAPER_STRATEGY || 'compression_family' }}
          ALPACA_DATA_FEED: ${{ vars.ALPACA_DATA_FEED || 'iex' }}
        run: python alpaca_paper_bot.py --mode "$PILOT_MODE"
      - name: Flag coordinator failures
        if: failure()
        run: echo 'Paper coordinator failed. Review the paper broker dashboard; a failed job does not guarantee absence of an accepted order or position. No successful tick is claimed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve registry, signal decisions and coordinator status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpaca-paper-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/alpaca_paper/
          if-no-files-found: warn
          retention-days: 30
