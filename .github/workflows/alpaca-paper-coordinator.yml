name: Alpaca paper coordinator
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check and scan never submit orders; tick requires explicit paper enablement'
        type: choice
        default: check
        options: [check, scan, tick]
  schedule:
    - cron: '*/5 13-21 * * 1-5'
permissions:
  contents: read
concurrency:
  group: alpaca-paper-coordinator
  cancel-in-progress: false
jobs:
  paper:
    if: github.event_name == 'workflow_dispatch' || vars.ALPACA_PAPER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check out immutable signal definitions separately
        uses: actions/checkout@v4
        with:
          ref: f2b5542f892cf1c6f3724ed68d343b4699354541
          path: signal_source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install paper coordinator dependencies
        run: python -m pip install 'requests>=2.32,<3' 'pandas>=2.2,<3' 'numpy>=1.26,<3' 'beautifulsoup4>=4.12,<5' 'pytest>=8,<10'
      - name: Test paper safeguards before making broker requests
        run: python -m pytest -q tests/test_alpaca_paper_bot.py tests/test_alpaca_paper_readiness.py
      - name: Check, scan or reconcile paper orders
        env:
          RUN_MODE: ${{ inputs.mode || 'tick' }}
          ALPACA_PAPER_KEY_ID: ${{ secrets.ALPACA_PAPER_KEY_ID }}
          ALPACA_PAPER_SECRET_KEY: ${{ secrets.ALPACA_PAPER_SECRET_KEY }}
          ALPACA_EXPECTED_PAPER_ACCOUNT_ID: ${{ vars.ALPACA_EXPECTED_PAPER_ACCOUNT_ID }}
          ALPACA_PAPER_ENABLED: ${{ vars.ALPACA_PAPER_ENABLED || 'false' }}
          ALPACA_PAPER_STRATEGY: ${{ vars.ALPACA_PAPER_STRATEGY || 'compression_family' }}
          ALPACA_DATA_FEED: ${{ vars.ALPACA_DATA_FEED || 'iex' }}
        run: python run_alpaca_paper.py --mode "$RUN_MODE"
      - name: Flag failed runs without claiming positions are closed
        if: failure()
        run: echo 'PAPER coordinator failed. Inspect the paper dashboard and open orders. Failure does not imply liquidation; protective broker orders may remain active.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpaca-paper-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/alpaca_paper/
          if-no-files-found: warn
          retention-days: 30
