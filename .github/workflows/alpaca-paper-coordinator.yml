name: Alpaca paper coordinator
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check/scan are read-only; tick permits nine PAPER positions, 10% allocation, previous-high TP'
        type: choice
        default: tick
        options: [check, scan, tick]
  schedule:
    - cron: '*/5 13-21 * * 1-5'
permissions:
  contents: read
concurrency:
  group: alpaca-paper-pilot-account
  cancel-in-progress: false
jobs:
  paper:
    if: vars.ALPACA_PAPER_KILL_SWITCH != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: f2b5542f892cf1c6f3724ed68d343b4699354541
          path: signal_source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'requests>=2.32,<3' 'pandas>=2.2,<3' 'numpy>=1.26,<2' 'beautifulsoup4>=4.12,<5' 'pytest>=8,<10'
      - name: Test broker safeguards, reconciliation and prior-high policy
        run: python -m pytest -q tests/test_alpaca_paper_bot.py tests/test_alpaca_paper_readiness.py tests/test_paper_exit_safety.py tests/test_held_bracket_protection.py tests/test_portfolio_reconciliation.py tests/test_previous_high_policy.py
      - name: Test source loading and full-session engine
        run: |
          python paper_scan_repair.py --selftest
          python run_alpaca_paper_hybrid.py --selftest
      - name: Test preserved baseline sizing and reconciliation
        run: python portfolio_paper.py --selftest
      - name: Run portfolio paper coordinator
        env:
          RUN_MODE: ${{ inputs.mode || 'tick' }}
          ALPACA_PAPER_KEY_ID: ${{ secrets.ALPACA_PAPER_KEY_ID }}
          ALPACA_PAPER_SECRET_KEY: ${{ secrets.ALPACA_PAPER_SECRET_KEY }}
          ALPACA_EXPECTED_PAPER_ACCOUNT_ID: ${{ vars.ALPACA_EXPECTED_PAPER_ACCOUNT_ID }}
          ALPACA_PAPER_ENABLED: 'true'
          ALPACA_PAPER_KILL_SWITCH: ${{ vars.ALPACA_PAPER_KILL_SWITCH || 'false' }}
          ALPACA_PAPER_STRATEGY: ${{ vars.ALPACA_PAPER_STRATEGY || 'compression_family' }}
          ALPACA_DATA_FEED: ${{ vars.ALPACA_DATA_FEED || 'iex' }}
        run: python portfolio_runtime.py --mode "$RUN_MODE"
      - name: Flag failures
        if: failure()
        run: echo 'Paper coordinator failed. Inspect paper positions and open orders; failure does not imply liquidation.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpaca-paper-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/alpaca_paper/
          if-no-files-found: warn
          retention-days: 30
