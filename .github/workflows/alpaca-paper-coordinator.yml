name: Alpaca paper coordinator
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check/scan are read-only; tick can submit PAPER orders'
        type: choice
        default: tick
        options: [check, scan, tick]
  schedule:
    - cron: '*/5 13-21 * * 1-5'
permissions:
  contents: read
concurrency:
  group: alpaca-paper-pilot-account
  cancel-in-progress: false
jobs:
  paper:
    if: vars.ALPACA_PAPER_KILL_SWITCH != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: f2b5542f892cf1c6f3724ed68d343b4699354541
          path: signal_source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'requests>=2.32,<3' 'pandas>=2.2,<3' 'numpy>=1.26,<3' 'beautifulsoup4>=4.12,<5' 'pytest>=8,<10'
      - name: Test existing broker safeguards
        run: python -m pytest -q tests/test_alpaca_paper_bot.py tests/test_alpaca_paper_readiness.py
      - name: Check hybrid wiring and deterministic target/window mechanics
        run: |
          python - <<'PY'
          import pandas as pd
          from run_alpaca_paper_hybrid import historical_target, entry_window, install
          engine=install()
          bars=[dict(t=f'{i:04d}',o=100,h=103,l=99.5,c=101) for i in range(300)]
          assert historical_target(bars,.01)['selected_r']==2
          assert historical_target(bars[:20],.01) is None
          assert historical_target([dict(b,l=98) for b in bars],.01) is None
          day=dict(date='2026-10-27',open='09:30',close='16:00')
          stamp=lambda s: pd.Timestamp('2026-10-27 '+s,tz='America/New_York').tz_convert('UTC')
          assert entry_window(stamp('09:30'),day,engine['session_time'])
          assert entry_window(stamp('10:00'),day,engine['session_time'])
          assert not entry_window(stamp('10:15'),day,engine['session_time'])
          assert not entry_window(stamp('16:00'),day,engine['session_time'])
          PY
      - name: Run hybrid paper coordinator
        env:
          RUN_MODE: ${{ inputs.mode || 'tick' }}
          ALPACA_PAPER_KEY_ID: ${{ secrets.ALPACA_PAPER_KEY_ID }}
          ALPACA_PAPER_SECRET_KEY: ${{ secrets.ALPACA_PAPER_SECRET_KEY }}
          ALPACA_EXPECTED_PAPER_ACCOUNT_ID: ${{ vars.ALPACA_EXPECTED_PAPER_ACCOUNT_ID }}
          ALPACA_PAPER_ENABLED: 'true'
          ALPACA_PAPER_STRATEGY: ${{ vars.ALPACA_PAPER_STRATEGY || 'compression_family' }}
          ALPACA_DATA_FEED: ${{ vars.ALPACA_DATA_FEED || 'iex' }}
        run: python run_alpaca_paper_hybrid.py --mode "$RUN_MODE"
      - name: Flag failures
        if: failure()
        run: echo 'Paper coordinator failed. Inspect Alpaca paper positions and orders; failure does not mean liquidation.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpaca-paper-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/alpaca_paper/
          if-no-files-found: warn
          retention-days: 30
