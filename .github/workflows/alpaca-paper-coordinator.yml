name: Alpaca paper coordinator
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check/scan are read-only; tick can submit PAPER orders with fixed 2R targets'
        type: choice
        default: tick
        options: [check, scan, tick]
  schedule:
    - cron: '*/5 13-21 * * 1-5'
permissions:
  contents: read
concurrency:
  group: alpaca-paper-pilot-account
  cancel-in-progress: false
jobs:
  paper:
    if: vars.ALPACA_PAPER_KILL_SWITCH != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: f2b5542f892cf1c6f3724ed68d343b4699354541
          path: signal_source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'requests>=2.32,<3' 'pandas>=2.2,<3' 'numpy>=1.26,<3' 'beautifulsoup4>=4.12,<5' 'pytest>=8,<10'
      - name: Test existing broker safeguards
        run: python -m pytest -q tests/test_alpaca_paper_bot.py tests/test_alpaca_paper_readiness.py
      - name: Test public source repair
        run: python paper_scan_repair.py --selftest
      - name: Test fixed 2R, formatting matches and half-hour entry windows
        run: python run_alpaca_paper_hybrid.py --selftest
      - name: Run fixed-2R paper coordinator
        env:
          RUN_MODE: ${{ inputs.mode || 'tick' }}
          ALPACA_PAPER_KEY_ID: ${{ secrets.ALPACA_PAPER_KEY_ID }}
          ALPACA_PAPER_SECRET_KEY: ${{ secrets.ALPACA_PAPER_SECRET_KEY }}
          ALPACA_EXPECTED_PAPER_ACCOUNT_ID: ${{ vars.ALPACA_EXPECTED_PAPER_ACCOUNT_ID }}
          ALPACA_PAPER_ENABLED: 'true'
          ALPACA_PAPER_STRATEGY: ${{ vars.ALPACA_PAPER_STRATEGY || 'compression_family' }}
          ALPACA_DATA_FEED: ${{ vars.ALPACA_DATA_FEED || 'iex' }}
        run: python paper_scan_repair.py --mode "$RUN_MODE"
      - name: Flag failures
        if: failure()
        run: echo 'Paper coordinator failed. Inspect Alpaca paper positions and orders; failure does not mean liquidation.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpaca-paper-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/alpaca_paper/
          if-no-files-found: warn
          retention-days: 30
